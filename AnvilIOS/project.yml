name: AnvilIOS
options:
  bundleIdPrefix: com.viniciuscotrim
packages:
  AnvilCore:
    path: ..
targets:
  AnvilIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AnvilIOS
    dependencies:
      - package: AnvilCore
        product: AnvilCore
    info:
      path: Sources/AnvilIOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viniciuscotrim.anvil.ios
        DEVELOPMENT_TEAM: U3H5DHZP65
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
