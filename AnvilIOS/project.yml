name: AnvilIOS
options:
  bundleIdPrefix: com.viniciuscotrim
packages:
  AnvilCore:
    path: ..
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  HuggingFaceHub:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.10.1
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
targets:
  AnvilIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AnvilIOS
    dependencies:
      - package: AnvilCore
        product: AnvilCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: HuggingFaceHub
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: SwiftTransformers
        product: Hub
    entitlements:
      path: Sources/AnvilIOS/AnvilIOS.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.viniciuscotrim.anvil
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: Sources/AnvilIOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSLocalNetworkUsageDescription: "Anvil looks for models you've loaded and exposed on your Mac on the same Wi-Fi network, so you can use them from your iPhone without typing an IP address."
        NSBonjourServices:
          - _device-info._tcp.
          - _companion-link._tcp.
          - _airplay._tcp.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viniciuscotrim.anvil.ios
        DEVELOPMENT_TEAM: U3H5DHZP65
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
