name: AnvilIOS
options:
  bundleIdPrefix: com.viniciuscotrim
packages:
  AnvilCore:
    path: ..
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  HuggingFaceHub:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.10.1
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  # GGUF/llama.cpp inference — the iOS counterpart to the Mac app's
  # llama_cpp.server subprocess (LLMServer.swift's `.llamaCpp` case),
  # which can't exist here at all (no Process on iOS). ggml-org/
  # llama.cpp itself dropped its own root Package.swift, so this wraps
  # its prebuilt xcframework release directly (`llama-b10068-
  # xcframework.zip`, pinned via LLM.swift's own Package.swift) with a
  # real Swift API — critically, `LLM(from:)` with no explicit
  # `template:` renders each model's own embedded Jinja chat template
  # (llama.cpp's own template engine) instead of guessing a fixed
  # prefix/suffix format, so an arbitrary downloaded GGUF (ChatML,
  # Llama 3's header format, Gemma, whatever it ships with) still gets
  # asked correctly. See `GGUFChatBackend.swift`.
  LLMSwift:
    url: https://github.com/eastriverlee/LLM.swift
    exactVersion: 3.0.3
targets:
  AnvilIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AnvilIOS
    dependencies:
      - package: AnvilCore
        product: AnvilCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: HuggingFaceHub
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: SwiftTransformers
        product: Hub
      - package: LLMSwift
        product: LLM
    entitlements:
      path: Sources/AnvilIOS/AnvilIOS.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.viniciuscotrim.anvil
        com.apple.developer.icloud-services:
          - CloudKit
        keychain-access-groups:
          - U3H5DHZP65.com.viniciuscotrim.anvil.credentials
    info:
      path: Sources/AnvilIOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSLocalNetworkUsageDescription: "Anvil looks for models you've loaded and exposed on your Mac on the same Wi-Fi network, so you can use them from your iPhone without typing an IP address."
        NSBonjourServices:
          - _device-info._tcp.
          - _companion-link._tcp.
          - _airplay._tcp.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viniciuscotrim.anvil.ios
        DEVELOPMENT_TEAM: U3H5DHZP65
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  # A real gap found while validating this round's fix: xcodegen 2.46
  # wasn't auto-generating a shared scheme for this target the way
  # earlier rounds relied on (`xcodebuild -scheme AnvilIOS ...` used to
  # just work) — `xcshareddata/xcschemes` came out empty after a fresh
  # `xcodegen generate`, leaving only the incidental schemes for the
  # local AnvilCore/Anvil package dependency. Declared explicitly here
  # so the scheme this project's own build/verify steps expect always
  # exists, regardless of xcodegen's current auto-generation defaults.
  AnvilIOS:
    build:
      targets:
        AnvilIOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
